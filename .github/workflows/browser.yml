name: Navegador opcional

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar pruebas web
        run: python -m pip install -e ".[dev,web,ui-test]"
      - name: Instalar Chromium
        run: python -m playwright install --with-deps chromium
      - name: Ejecutar pruebas reales de navegador
        env:
          RCWALL_BROWSER_TESTS: "1"
          RCWALL_UI_OUTPUT: outputs/ui-runs
        run: python -m pytest tests/test_web_browser.py
      - name: Adjuntar evidencia de esta ejecución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-chromium
          path: outputs/ui-runs/
          if-no-files-found: ignore
          retention-days: 7
