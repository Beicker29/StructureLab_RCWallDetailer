name: Python y web

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar desarrollo y web
        run: python -m pip install -e ".[dev,web]"
      - name: Pruebas de Python y API (navegador en workflow independiente)
        run: python -m pytest
      - name: Ruff check
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
