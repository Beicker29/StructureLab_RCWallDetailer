[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "structurelab-rcwalldetailer"
version = "0.2.0"
description = "Contratos canónicos V0.1 de StructureLab RCWallDetailer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "httpx>=0.28,<1"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
ui-test = ["playwright>=1.48,<2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["rcwall", "rcwall.*", "rcwall_web", "rcwall_web.*"]

[tool.setuptools.package-data]
rcwall_web = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".work"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
